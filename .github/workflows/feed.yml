# 配信（段1・ならべて走らせて見比べるためのもの）
#
# いまは Mac の定期実行（launchd）が prices.json と weather.json を作って、
# この置き場のルートへ押し上げている。**この段1は、その隣で同じ物を作って
# `staging/` にだけ置く。**ルートの 2本には 1バイトも触らない。
# 何日か見比べて、同じ物が出来ていると確かめてから、段2（feed.switch.yml）へ替える。
#
# **Mac も鍵も要らない形にしてある。**使う鍵は GitHub が勝手に用意する
# `GITHUB_TOKEN` だけで、こちらで秘密を 1つも足していない。
#
# 相手先（田中貴金属・気象庁）を叩く回数は、Mac のときと同じ。
#   相場  … 1日1回（17:35）
#   天気  … 1日3回（6:05・12:05・18:05）。58予報区を 1.5秒おきに取るので約90秒かかる

name: 配信（段1・staging）

on:
  schedule:
    # **ここに書く時刻は UTC。**括弧の中が日本時間（JST = UTC + 9時間）。
    # 毎時 00分ちょうどは世界中の予約が重なって遅れやすいので、5分ずらしてある。
    - cron: "5 21 * * *"    # 21:05 UTC ＝ 翌 06:05 JST  天気
    - cron: "5 3 * * *"     # 03:05 UTC ＝    12:05 JST  天気
    - cron: "35 8 * * *"    # 08:35 UTC ＝    17:35 JST  相場
    - cron: "5 9 * * *"     # 09:05 UTC ＝    18:05 JST  天気
  # 手で回すための口。Actions のタブ →「配信（段1・staging）」→「Run workflow」
  workflow_dispatch:
    inputs:
      what:
        description: "何を取るか"
        type: choice
        default: both
        options: [both, prices, weather]

# 置き場へ書き込む許し。**これだけ。**`GITHUB_TOKEN` に自動で付く
permissions:
  contents: write

# 同じ群の中では 1本しか走らせない（前の回が長引いているときに重ねない）。
# **走っている物は殺さない**（取り終わりかけを捨てると、その回がまるごと無駄になる）
concurrency:
  group: feed
  cancel-in-progress: false

env:
  # **これを忘れると 9時間ずれる。**JSON の中の「生成時刻」「取得」は
  # 走っている機械の時計で書かれる。Actions の機械は既定が UTC
  TZ: Asia/Tokyo

jobs:
  feed:
    runs-on: ubuntu-latest
    # 90秒の取得が 58回ぶん遅れても終わるだけの余裕。止まったままにしない
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # python は機械に初めから入っている物を使う。
      # **相場も天気も標準ライブラリだけで動く**ので、入れる物は 1つも無い
      - name: python を確かめる
        run: python3 -VV

      - name: staging を用意する
        run: mkdir -p staging

      # ---- 相場（17:35 の回だけ） -------------------------------------
      # 取れなかったら、ここで止まる。**staging/prices.json は古いまま残る**
      # （書き出しは「一時ファイルへ書いて、書き切れたら差し替え」）
      - name: 相場を取る
        if: >-
          github.event.schedule == '35 8 * * *' ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.what == 'both' || inputs.what == 'prices'))
        run: python3 tools/build_prices.py staging/prices.json

      # ---- 天気（6:05・12:05・18:05 の回だけ） ------------------------
      - name: 天気を取る
        if: >-
          github.event.schedule == '5 21 * * *' ||
          github.event.schedule == '5 3 * * *' ||
          github.event.schedule == '5 9 * * *' ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.what == 'both' || inputs.what == 'weather'))
        run: python3 tools/build_weather.py --out staging/weather.json

      # ---- ルートの物（Mac が押し上げた物）と見比べる ------------------
      # **これが段1の目的。**同じ物が出来ているかを、走るたびに log に残す。
      # 違っていても止めない（`|| true`）。見るのは人
      - name: Mac の物と見比べる
        run: |
          for f in prices.json weather.json; do
            if [ -f "$f" ] && [ -f "staging/$f" ]; then
              echo "---- $f"
              python3 tools/compare.py "$f" "staging/$f" || true
            fi
          done

      # ---- 置き場へ押し上げる -----------------------------------------
      # **変わっていなければ commit しない。**毎日空の記録を積まないため
      - name: 変わっていれば commit する
        run: |
          # **1本ずつ、在る物だけ add する。**`git add a b` は、b が無いだけで
          # a も足さずに終わる（初めて走った回に weather.json がまだ無い）
          for f in staging/prices.json staging/weather.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "押す物が無い（変わっていない）。終わる"
            exit 0
          fi
          git -c user.email=mypiece.support@gmail.com -c user.name="My piece" \
              commit -q -m "配信を更新（段1 staging・$(date '+%F %T')）"
          # 押せなかったら、新しい方を取り込んでもう一度だけ試す
          git push || { git pull --rebase && git push; }
          echo "押し上げた"

  # ---- 60日で止まるのを防ぐための声かけ（月はじめの回だけ） ------------
  # 公開リポジトリの予約実行は、**置き場に何の動きも無いまま60日たつと、
  # GitHub が自動で止める。**この仕事の commit がその「動き」に数えられる、とは
  # GitHub の文書に書かれていない（数えられないという報告が多い）。
  # なので、月に1回「人が手で1回押してください」という宿題を 1枚立てる。
  # **新しい鍵は要らない**（`issues: write` も GITHUB_TOKEN に付く）。
  keepalive:
    # 1日4回のうち、夜の回（18:05 JST）だけ見る。日付は下で見る
    if: github.event.schedule == '5 9 * * *'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 月はじめなら、点検の宿題を1枚立てる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "毎月の点検：配信を手で1回まわしてください"
        run: |
          if [ "$(date '+%d')" != "01" ]; then
            echo "月はじめではない。何もしない"; exit 0
          fi
          # もう開いている同じ宿題があれば、増やさない
          open=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "${open:-0}" != "0" ]; then
            echo "すでに開いている。何もしない"; exit 0
          fi
          # **ヒアドキュメント（<<MD …）は使えない。**中身を字下げしないと
          # yml が壊れ、字下げすると宿題の本文の頭に空白が入る（印刷の体裁が崩れる）
          gh issue create --title "$TITLE" --body "$(printf '%s\n' \
            '公開リポジトリの予約実行は、置き場に動きが無いまま60日たつと GitHub が自動で止めます。' \
            'この仕事じたいの commit が「動き」に数えられるかは、GitHub の文書に書かれていません。' \
            '' \
            '**1分で済む点検です。**' \
            '' \
            '1. 上の「Actions」タブを開く' \
            '2. 左の一覧から「配信（段1・staging）」を選ぶ' \
            '3. 右の「Run workflow」を押す（何を取るかは weather のままでよい）' \
            '4. 緑のチェックが付いたら、この宿題を閉じる' \
            '' \
            '止まっていた場合は、同じ画面に「Enable workflow」というボタンが出ます。' \
            'それを押せば戻ります。詳しくは `docs/配信の手順_Actions.md`。')"
          echo "宿題を立てた"
